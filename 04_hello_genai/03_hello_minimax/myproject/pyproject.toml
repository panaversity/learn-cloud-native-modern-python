[project]
name = "myproject"
version = "0.1.0"
description = "Hello MiniMax AI - Getting started with MiniMax LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
minimax = "myproject.hello:minimax"
minimax_stream = "myproject.hello:minimax_stream"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
